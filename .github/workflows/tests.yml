name: Tests
on:
  push:
    paths: ['src/**', 'app/**', 'tests/**', 'public_demo/**', 'pyproject.toml', 'requirements*', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Install
        run: python -m pip install -e ".[ui,dev]"
      - name: Dependency compatibility
        run: python -m pip check
      - name: Offline suite
        run: python -m pytest -q -m "not integration" --junitxml=reports/tests.xml
      - name: Reproducible lexical demo
        run: python -m forestrag.cli demo --out reports/demo.json
  full-locked-environment:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Locked dependencies
        run: python -m pip install --require-hashes -r requirements-full-linux-py312.lock
      - name: Consistent bootstrap metadata
        run: python -m pip install --force-reinstall --require-hashes -r requirements-bootstrap-linux-py312.lock
      - name: Reject duplicate bootstrap metadata
        run: python -c "from importlib.metadata import distributions; assert [d.version for d in distributions() if d.metadata['Name'].lower() == 'pip'] == ['26.2.2']"
      - name: Install local source without dependency resolution
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Compatibility
        run: python -m pip check
      - name: Offline contracts and security
        run: python -m pytest -q -m "not integration"

