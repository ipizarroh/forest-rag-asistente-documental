name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[ui,dev]"
      - name: Dependency compatibility
        run: python -m pip check
      - name: Offline suite
        run: python -m pytest -q -m "not integration" --junitxml=reports/tests.xml
      - name: Reproducible lexical demo
        run: python -m forestrag.cli demo --out reports/demo.json

