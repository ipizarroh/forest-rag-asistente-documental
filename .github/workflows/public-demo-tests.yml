name: Public demo candidate checks
on:
  push:
    paths: ["public_demo/**", "src/forestrag/**", "tests/test_public_demo.py", "requirements-lab-linux-py312.lock", ".github/workflows/public-demo-tests.yml"]
  pull_request:
    paths: ["public_demo/**", "src/forestrag/**", "tests/test_public_demo.py", "requirements-lab-linux-py312.lock", ".github/workflows/public-demo-tests.yml"]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.1"
      - run: python -m pip install --require-hashes -r requirements-lab-linux-py312.lock
      - run: python -m pytest -q tests/test_public_demo.py
      - run: python public_demo/build.py
      - run: node --test public_demo/test_engine.mjs
