[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forestrag"
version = "0.1.0"
description = "Prototipo personal de recuperación documental forestal trazable"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ignacio Pizarro Hurtado"}]
dependencies = ["numpy==2.3.5", "pypdf==6.21.2"]

[project.optional-dependencies]
semantic = ["onnxruntime==1.31.0", "tokenizers==0.23.3", "huggingface-hub==1.33.0"]
ui = ["streamlit==1.66.1", "pillow==13.0.0"]
dev = ["pytest==9.1.1"]

[project.scripts]
forestrag = "forestrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requiere modelo local y PDF descargados"]

